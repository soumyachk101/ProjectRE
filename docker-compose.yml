services:
  backend:
    build:
      context: ./backend
    container_name: roadsense-backend
    environment:
      DATABASE_URL: postgresql://roadsense:roadsense123@db:5432/roadsense
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-roadsense-sensor-data}
      MINIO_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:-ojJYtsTgD0He/E5qSmFNOlq6oSY8GL8ZHeZNxSvYGhA=}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      OTP_MOCK_MODE: ${OTP_MOCK_MODE:-true}
      ML_SERVICE_URL: http://ml:8001
      NODE_ENV: production
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  db:
    image: postgis/postgis:16-3.4
    container_name: roadsense-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roadsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roadsense123}
      POSTGRES_DB: ${POSTGRES_DB:-roadsense}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roadsense}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roadsense-redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: roadsense-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml:
    build:
      context: ./backend/ml
    container_name: roadsense-ml
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Create bucket on first run
  minio-init:
    image: minio/mc:latest
    container_name: roadsense-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-roadsense-sensor-data};
      echo 'MinIO bucket created';
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
